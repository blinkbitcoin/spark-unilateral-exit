name: Desktop Regtest
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SPARK_LOCAL_DIR: ${{ github.workspace }}/upstream-spark
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: buildonspark/spark
          # Same upstream revision used for the desktop acceptance run.
          ref: a2c30d66512f8b45261d01f864b497788aca7715
          path: upstream-spark
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx playwright install-deps chromium
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bash scripts/desktop-regtest.sh up
      - run: xvfb-run -a bash scripts/desktop-regtest.sh test
      - if: always()
        run: bash scripts/desktop-regtest.sh stop
